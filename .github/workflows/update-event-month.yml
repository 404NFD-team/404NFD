name: Update Event Month

on:
  workflow_dispatch:
  schedule:
    - cron: "10 16 1 * *"

permissions:
  contents: write

jobs:
  update-event-month:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update event fallback month
        run: node ".github/scripts/update-event-month.js"

      - name: Commit changes
        run: |
          if git diff --quiet -- "new web/scripts/events.js"; then
            echo "No event month change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "new web/scripts/events.js"
          git commit -m "chore: update event calendar month"
          git push
